<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FlowBudget</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>

<!-- Fixed Header -->
<header class="app-header">
  <div class="header-logo" onclick="goBack()">💰 FlowBudget</div>
  <div class="header-right">
    <button id="authBtn" class="auth-btn" onclick="toggleAuthPanel()">Login</button>
    <div id="userInfo" style="display:none" class="user-info-wrap">
      <button class="user-avatar-btn" id="userAvatarBtn" onclick="toggleUserMenu()">?</button>
      <div id="userMenu" class="user-menu" style="display:none">
        <div class="user-menu-name" id="userMenuName"></div>
        <div class="user-menu-email" id="userMenuEmail"></div>
        <div class="user-menu-divider"></div>
        <button id="editNameMenuBtn" class="user-menu-action" onclick="closeUserMenu(); promptNameChange()" style="display:none">✏️ Rename</button>
        <button class="user-menu-action user-menu-logout" onclick="logout()">Sign out</button>
      </div>
    </div>
  </div>
</header>

<!-- Auth Modal -->
<div id="authModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <button class="close-btn" onclick="toggleAuthPanel()">✕</button>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="setAuthTab('login')">Login</button>
      <button class="auth-tab" id="tabSignup" onclick="setAuthTab('signup')">Sign Up</button>
    </div>
    <div id="signupOnlyFields" style="display:none">
      <input id="name" placeholder="Full Name" autocomplete="name" maxlength="30">
    </div>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="authActionBtn" onclick="login()">Login</button>
    <div id="authStatus" class="status-msg"></div>
  </div>
</div>

<!-- Add/Edit Expense Modal -->
<div id="expenseModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <button class="close-btn" onclick="closeExpenseModal()">✕</button>
    <h2 id="expenseModalTitle">Add Expense</h2>
    <input id="expenseDesc" placeholder="Description (e.g. Dinner)">
    <input id="expenseAmount" type="number" step="0.01" min="0.01" placeholder="Amount" oninput="updateSplitAmounts()">
    <label class="field-label">Category</label>
    <select id="expenseCategory">
      <option value="food">🍔 Food &amp; Drink</option>
      <option value="transport">🚗 Transport</option>
      <option value="accommodation">🏠 Accommodation</option>
      <option value="entertainment">🎉 Entertainment</option>
      <option value="shopping">🛍️ Shopping</option>
      <option value="other" selected>🧾 Other</option>
    </select>
    <label class="field-label">Paid by</label>
    <select id="paidBy"></select>
    <label class="field-label">Split</label>
    <select id="splitType" onchange="updateSplitUI()">
      <option value="equal">Equal</option>
      <option value="custom">Custom amounts</option>
      <option value="ratio">By ratio</option>
    </select>
    <div id="splitEqual">
      <div id="splitWith" class="split-members"></div>
    </div>
    <div id="splitCustom" style="display:none">
      <div id="splitCustomInputs" class="split-inputs"></div>
      <p id="splitCustomRemaining" class="split-remaining"></p>
    </div>
    <div id="splitRatio" style="display:none">
      <div id="splitRatioInputs" class="split-inputs"></div>
    </div>
    <button id="expenseSubmitBtn" onclick="submitExpense()">Add Expense</button>
  </div>
</div>

<!-- Settle Up Modal -->
<div id="settleModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <button class="close-btn" onclick="closeSettleModal()">✕</button>
    <h2>Settle Up</h2>
    <p id="settleDesc" class="settle-desc"></p>
    <input id="settleAmount" type="number" step="0.01" min="0.01" placeholder="Amount">
    <button onclick="confirmSettle()">Confirm Payment</button>
  </div>
</div>

<div class="app-container">

  <!-- MAIN VIEW -->
  <div id="mainView">
    <div id="guestBanner" class="guest-banner" style="display:none">
      <p>👋 Welcome to FlowBudget! Login or signup to split expenses with friends.</p>
    </div>
    <div id="loggedInSection" style="display:none">
      <div class="card">
        <h3>Create Group</h3>
        <input id="groupName" placeholder="Group name (e.g. Barcelona Trip)">
        <select id="groupCurrency">
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
          <option value="GBP">£ GBP</option>
          <option value="INR">₹ INR</option>
          <option value="JPY">¥ JPY</option>
          <option value="AUD">A$ AUD</option>
          <option value="CAD">C$ CAD</option>
        </select>
        <button onclick="createGroup()">Create Group</button>
      </div>
      <div class="card">
        <h3>Join Group</h3>
        <input id="inviteCode" placeholder="Enter invite code">
        <button onclick="joinGroup()">Join Group</button>
      </div>
      <div class="card">
        <h3>Your Groups</h3>
        <div id="groupsList"></div>
      </div>
    </div>
  </div>

  <!-- GROUP DETAIL VIEW -->
  <div id="groupDetail" style="display:none">
    <div class="back-bar">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <h2 id="groupDetailName"></h2>
      <span id="groupInviteCode" class="invite-badge" onclick="copyInviteCode()" title="Click to copy"></span>
    </div>
    <div class="group-detail-grid">
      <div class="card">
        <h3>Members</h3>
        <div id="membersList"></div>
      </div>
      <div class="card">
        <div class="section-header">
          <h3>Expenses</h3>
          <button class="add-btn" onclick="openExpenseModal()">+ Add</button>
        </div>
        <div id="expensesList"></div>
      </div>
    </div>
    <div class="card">
      <div class="section-header">
        <h3>Balances</h3>
        <button class="toggle-btn active" id="simplifyToggle" onclick="toggleSimplify()">Simplified ✓</button>
      </div>
      <div id="balancesList"></div>
    </div>
    <div class="card">
      <h3>Activity</h3>
      <div id="activityFeed"></div>
    </div>
    <div class="danger-zone">
      <button class="leave-btn" onclick="leaveGroup()">Leave Group</button>
    </div>
  </div>

</div>

<script src="./app.js"></script>

<footer class="app-footer">
  <a class="bmc-btn" href="https://buymeacoffee.com/" target="_blank" rel="noopener">☕ Buy me a coffee</a>
</footer>
</body>
</html>
