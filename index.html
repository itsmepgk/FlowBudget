<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FlowBudget</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>

<!-- Fixed Header -->
<header class="app-header">
  <div class="header-logo" onclick="goBack()">💰 FlowBudget</div>
  <div class="header-right">
    <button id="authBtn" class="auth-btn" onclick="toggleAuthPanel()">Login</button>
    <div id="userInfo" style="display:none">
      <span id="userNameDisplay" class="user-name-display"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<!-- Auth Modal -->
<div id="authModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <button class="close-btn" onclick="toggleAuthPanel()">✕</button>
    <h2>Login / Signup</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="name" placeholder="Full Name (signup only)">
    <input id="password" type="password" placeholder="Password">
    <div class="btn-row">
      <button onclick="signup()">Signup</button>
      <button onclick="login()">Login</button>
    </div>
    <div id="authStatus" class="status-msg"></div>
  </div>
</div>

<!-- Add Expense Modal -->
<div id="expenseModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <button class="close-btn" onclick="closeExpenseModal()">✕</button>
    <h2>Add Expense</h2>
    <input id="expenseDesc" placeholder="Description (e.g. Dinner)">
    <input id="expenseAmount" type="number" step="0.01" min="0.01" placeholder="Amount">
    <label class="field-label">Category</label>
    <select id="expenseCategory">
      <option value="food">🍔 Food &amp; Drink</option>
      <option value="transport">🚗 Transport</option>
      <option value="accommodation">🏠 Accommodation</option>
      <option value="entertainment">🎉 Entertainment</option>
      <option value="shopping">🛍️ Shopping</option>
      <option value="other" selected>🧾 Other</option>
    </select>
    <label class="field-label">Paid by</label>
    <select id="paidBy"></select>
    <label class="field-label">Split with</label>
    <div id="splitWith" class="split-members"></div>
    <button onclick="addExpense()">Add Expense</button>
  </div>
</div>

<!-- Settle Up Modal -->
<div id="settleModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <button class="close-btn" onclick="closeSettleModal()">✕</button>
    <h2>Settle Up</h2>
    <p id="settleDesc" class="settle-desc"></p>
    <input id="settleAmount" type="number" step="0.01" min="0.01" placeholder="Amount">
    <button onclick="confirmSettle()">Confirm Payment</button>
  </div>
</div>

<div class="app-container">

  <!-- MAIN VIEW -->
  <div id="mainView">
    <div id="guestBanner" class="guest-banner" style="display:none">
      <p>👋 Welcome to FlowBudget! Login or signup to split expenses with friends.</p>
    </div>
    <div id="loggedInSection" style="display:none">
      <div class="card">
        <h3>Create Group</h3>
        <input id="groupName" placeholder="Group name (e.g. Barcelona Trip)">
        <select id="groupCurrency">
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
          <option value="GBP">£ GBP</option>
          <option value="INR">₹ INR</option>
          <option value="JPY">¥ JPY</option>
          <option value="AUD">A$ AUD</option>
          <option value="CAD">C$ CAD</option>
        </select>
        <button onclick="createGroup()">Create Group</button>
      </div>
      <div class="card">
        <h3>Join Group</h3>
        <input id="inviteCode" placeholder="Enter invite code">
        <button onclick="joinGroup()">Join Group</button>
      </div>
      <div class="card">
        <h3>Your Groups</h3>
        <div id="groupsList"></div>
      </div>
    </div>
  </div>

  <!-- GROUP DETAIL VIEW -->
  <div id="groupDetail" style="display:none">
    <div class="back-bar">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <h2 id="groupDetailName"></h2>
      <span id="groupInviteCode" class="invite-badge" onclick="copyInviteCode()" title="Click to copy"></span>
    </div>
    <div class="group-detail-grid">
      <div class="card">
        <h3>Members</h3>
        <div id="membersList"></div>
      </div>
      <div class="card">
        <div class="section-header">
          <h3>Expenses</h3>
          <button class="add-btn" onclick="openExpenseModal()">+ Add</button>
        </div>
        <div id="expensesList"></div>
      </div>
    </div>
    <div class="card">
      <h3>Balances</h3>
      <div id="balancesList"></div>
    </div>
    <div class="card">
      <h3>Activity</h3>
      <div id="activityFeed"></div>
    </div>
    <div class="danger-zone">
      <button class="leave-btn" onclick="leaveGroup()">Leave Group</button>
    </div>
  </div>

</div>

<script src="./app.js"></script>
</body>
</html>
